* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'ABC Oracle Edu', system-ui, sans-serif;
    background: #F6F7F3;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.chart-container {
    width: 900px;
    background: #F6F7F3;
}

.chart-title {
    font-size: 23px;
    font-weight: 500;
    color: #3D3733;
    margin-bottom: 4px;
    line-height: 1.2;
}

.chart-subtitle {
    font-size: 16px;
    font-weight: 300;
    color: #3D3733;
    opacity: 0.7;
    margin-bottom: 16px;
    line-height: 1.3;
}

.chart-source {
    font-size: 11px;
    font-weight: 300;
    color: #999;
    font-style: italic;
    margin-top: 8px;
}

.tooltip {
    position: absolute;
    background: white;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: 'ABC Oracle Edu', system-ui, sans-serif;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    color: #3D3733;
}


.axis text { font-size: 12px; fill: #3D3733; font-family: 'ABC Oracle Edu', system-ui; }
.grid line { stroke: #D0D0D0; stroke-width: 0.5; opacity: 0.7; }
.grid .domain { display: none; }

</style>

<body>
<div class="chart-container">
    <div class="chart-title">Remote Work Is the Strongest Predictor of Weak Rents</div>
    <div class="chart-subtitle">WFH share vs. cumulative rent change across ~50 metros, 2019-2025. DC is an outlier on both axes.</div>
    
    <div class="chart-source">Source: ACS 1-Year (TRANWORK=80), Zillow ZORI</div>
</div>
<div class="tooltip" id="tooltip"></div>
<script>

const DATA = [{"name": "Atlanta", "x": 18.3, "y": 38.2, "group": "default", "size": 3139458.0}, {"name": "Austin", "x": 23.6, "y": 14.0, "group": "default", "size": 1378559.0}, {"name": "Baltimore", "x": 15.4, "y": 31.7, "group": "default", "size": 1358456.0}, {"name": "Birmingham", "x": 10.0, "y": 35.2, "group": "default", "size": 518749.0}, {"name": "Boston", "x": 17.3, "y": 28.7, "group": "default", "size": 2606409.0}, {"name": "Buffalo", "x": 10.4, "y": 44.6, "group": "default", "size": 534654.0}, {"name": "Charlotte", "x": 19.0, "y": 36.0, "group": "default", "size": 1460701.0}, {"name": "Chicago", "x": 14.9, "y": 36.3, "group": "default", "size": 4581268.0}, {"name": "Cincinnati", "x": 12.8, "y": 42.7, "group": "default", "size": 1052592.0}, {"name": "Columbus", "x": 16.7, "y": 38.0, "group": "default", "size": 1058805.0}, {"name": "Dallas", "x": 15.4, "y": 27.0, "group": "default", "size": 4075349.0}, {"name": "Denver", "x": 21.1, "y": 19.5, "group": "default", "size": 1655146.0}, {"name": "Detroit", "x": 13.6, "y": 41.4, "group": "default", "size": 2005940.0}, {"name": "Fresno", "x": 8.7, "y": 49.2, "group": "default", "size": 424263.0}, {"name": "Hartford", "x": 14.2, "y": 50.2, "group": "default", "size": 559670.0}, {"name": "Houston", "x": 11.5, "y": 22.4, "group": "default", "size": 3546473.0}, {"name": "Indianapolis", "x": 13.3, "y": 47.5, "group": "default", "size": 1065816.0}, {"name": "Jacksonville", "x": 16.2, "y": 37.5, "group": "default", "size": 814117.0}, {"name": "Kansas City", "x": 14.5, "y": 43.5, "group": "default", "size": 1134084.0}, {"name": "Las Vegas", "x": 10.6, "y": 36.0, "group": "default", "size": 1119175.0}, {"name": "Los Angeles", "x": 14.6, "y": 28.0, "group": "default", "size": 6162472.0}, {"name": "Louisville", "x": 11.8, "y": 39.8, "group": "default", "size": 615355.0}, {"name": "Memphis", "x": 9.4, "y": 43.0, "group": "default", "size": 541254.0}, {"name": "Miami", "x": 12.9, "y": 53.3, "group": "default", "size": 3016333.0}, {"name": "Milwaukee", "x": 12.9, "y": 37.0, "group": "default", "size": 752889.0}, {"name": "Minneapolis", "x": 18.1, "y": 21.6, "group": "default", "size": 1904756.0}, {"name": "Nashville", "x": 16.0, "y": 29.2, "group": "default", "size": 1113218.0}, {"name": "New Orleans", "x": 9.8, "y": 27.3, "group": "default", "size": 545949.0}, {"name": "New York", "x": 13.8, "y": 32.5, "group": "default", "size": 9593783.0}, {"name": "Oklahoma City", "x": 9.8, "y": 36.0, "group": "default", "size": 672183.0}, {"name": "Orlando", "x": 15.8, "y": 36.6, "group": "default", "size": 1419496.0}, {"name": "Philadelphia", "x": 15.8, "y": 33.5, "group": "default", "size": 3020719.0}, {"name": "Phoenix", "x": 17.8, "y": 36.1, "group": "default", "size": 2452368.0}, {"name": "Pittsburgh", "x": 15.3, "y": 32.0, "group": "default", "size": 1064423.0}, {"name": "Portland", "x": 19.7, "y": 25.1, "group": "default", "size": 1241169.0}, {"name": "Providence", "x": 10.8, "y": 58.9, "group": "default", "size": 825815.0}, {"name": "Raleigh", "x": 23.0, "y": 30.7, "group": "default", "size": 786737.0}, {"name": "Richmond", "x": 16.0, "y": 43.6, "group": "default", "size": 663397.0}, {"name": "Riverside", "x": 10.1, "y": 47.2, "group": "default", "size": 2069437.0}, {"name": "Rochester", "x": 11.4, "y": 48.2, "group": "default", "size": 488188.0}, {"name": "Sacramento", "x": 16.8, "y": 33.9, "group": "default", "size": 1104293.0}, {"name": "St. Louis", "x": 13.2, "y": 43.1, "group": "default", "size": 1380476.0}, {"name": "Salt Lake City", "x": 16.2, "y": 33.2, "group": "default", "size": 710270.0}, {"name": "San Antonio", "x": 12.5, "y": 17.5, "group": "default", "size": 1240095.0}, {"name": "San Diego", "x": 15.7, "y": 40.7, "group": "default", "size": 1606992.0}, {"name": "San Francisco", "x": 21.5, "y": 12.8, "group": "default", "size": 2286758.0}, {"name": "San Jose", "x": 18.9, "y": 15.9, "group": "default", "size": 966680.0}, {"name": "Seattle", "x": 20.2, "y": 25.6, "group": "default", "size": 2126676.0}, {"name": "Tampa", "x": 17.9, "y": 50.4, "group": "default", "size": 1594605.0}, {"name": "Tucson", "x": 12.9, "y": 41.7, "group": "default", "size": 466936.0}, {"name": "Tulsa", "x": 9.9, "y": 43.7, "group": "default", "size": 523918.0}, {"name": "Urban Honolulu", "x": 7.5, "y": 31.4, "group": "default", "size": 475372.0}, {"name": "Virginia Beach", "x": 10.4, "y": 49.0, "group": "default", "size": 812617.0}, {"name": "Washington", "x": 21.2, "y": 23.7, "group": "highlight", "size": 3311535.0}];
const WIDTH = 900, HEIGHT = 650;
const MARGIN = {top: 30, right: 30, bottom: 65, left: 75};
const innerW = WIDTH - MARGIN.left - MARGIN.right;
const innerH = HEIGHT - MARGIN.top - MARGIN.bottom;

const svg = d3.select(".chart-container").append("svg").attr("width", WIDTH).attr("height", HEIGHT);
const g = svg.append("g").attr("transform", `translate(${MARGIN.left},${MARGIN.top})`);

const x = d3.scaleLinear().domain([d3.min(DATA, d => d.x) * 0.9, d3.max(DATA, d => d.x) * 1.1]).range([0, innerW]);
const y = d3.scaleLinear().domain([d3.min(DATA, d => d.y) * 0.9, d3.max(DATA, d => d.y) * 1.1]).range([innerH, 0]);
const r = d3.scaleSqrt().domain([0, d3.max(DATA, d => d.size)]).range([4, 18]);

g.append("g").attr("class", "grid").call(d3.axisLeft(y).tickSize(-innerW).tickFormat(""));

// Regression line
const xMean = d3.mean(DATA, d => d.x), yMean = d3.mean(DATA, d => d.y);
let num = 0, den = 0;
DATA.forEach(d => { num += (d.x - xMean) * (d.y - yMean); den += (d.x - xMean) ** 2; });
const slope = num / den, intercept = yMean - slope * xMean;
const xRange = d3.extent(DATA, d => d.x);
g.append("line")
    .attr("x1", x(xRange[0])).attr("y1", y(intercept + slope * xRange[0]))
    .attr("x2", x(xRange[1])).attr("y2", y(intercept + slope * xRange[1]))
    .attr("stroke", "#999").attr("stroke-width", 1).attr("stroke-dasharray", "5,3");

g.append("g").attr("class", "axis").attr("transform", `translate(0,${innerH})`)
    .call(d3.axisBottom(x).ticks(6).tickFormat(d => d + "%"));
const yAx = g.append("g").attr("class", "axis")
    .call(d3.axisLeft(y).ticks(6).tickSize(0).tickFormat(d => d + "%"));
yAx.select(".domain").remove();

g.append("text").attr("class", "axis-label").attr("x", innerW / 2).attr("y", innerH + 50)
    .attr("text-anchor", "middle").attr("font-size", 13).attr("fill", "#3D3733").attr("font-weight", 300)
    .text("Average WFH Share (2019-2025)");
g.append("text").attr("class", "axis-label").attr("transform", "rotate(-90)")
    .attr("x", -innerH / 2).attr("y", -55).attr("text-anchor", "middle")
    .attr("font-size", 13).attr("fill", "#3D3733").attr("font-weight", 300)
    .text("Cumulative Rent Change, 2019-2025 (%)");

const tooltip = d3.select("#tooltip");
g.selectAll(".dot").data(DATA).join("circle").attr("class", "dot")
    .attr("cx", d => x(d.x)).attr("cy", d => y(d.y))
    .attr("r", d => r(d.size))
    .attr("fill", d => d.group === "highlight" ? "#F4743B" : "#0BB4FF")
    .attr("opacity", d => d.group === "highlight" ? 0.9 : 0.4)
    .attr("stroke", d => d.group === "highlight" ? "#3D3733" : "white")
    .attr("stroke-width", d => d.group === "highlight" ? 2 : 0.5)
    .on("mouseover", function(event, d) {
        d3.select(this).attr("opacity", 1).attr("stroke-width", 2);
        tooltip.html(`<strong>${d.name}</strong><br>WFH share: ${d.x.toFixed(1)}%<br>Rent change: ${d.y.toFixed(1)}%`)
            .style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 28) + "px").style("opacity", 1);
    })
    .on("mouseout", function() {
        d3.select(this).attr("opacity", d => d.group === "highlight" ? 0.9 : 0.4).attr("stroke-width", d => d.group === "highlight" ? 2 : 0.5);
        tooltip.style("opacity", 0);
    });

// Label DC + SF
DATA.filter(d => d.group === "highlight" || d.name === "San Francisco" || d.name === "San Jose" || d.name === "Austin").forEach(d => {
    g.append("text").attr("x", x(d.x) + r(d.size) + 6).attr("y", y(d.y))
        .attr("dy", "0.35em")
        .attr("font-size", d.group === "highlight" ? 13 : 11)
        .attr("font-weight", d.group === "highlight" ? 500 : 400)
        .attr("fill", d.group === "highlight" ? "#F4743B" : "#3D3733")
        .text(d.name);
});

// Annotation
g.append("text").attr("x", innerW - 10).attr("y", 15)
    .attr("text-anchor", "end").attr("font-size", 11).attr("fill", "#999").attr("font-style", "italic")
    .text("β = " + slope.toFixed(2) + "pp rent per 1pp WFH (p=0.03)");

</script>
</body>
</html>
