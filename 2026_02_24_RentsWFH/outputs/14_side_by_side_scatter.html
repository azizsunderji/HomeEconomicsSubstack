e", "rent": 15.9, "permits": 26.4, "wfh": 18.9, "pop": 966680, "is_dc": false}, {"name": "Seattle, WA", "short_name": "Seattle", "rent": 25.6, "permits": 44.6, "wfh": 20.2, "pop": 2126676, "is_dc": false}, {"name": "Tampa, FL", "short_name": "Tampa", "rent": 50.4, "permits": 26.9, "wfh": 17.9, "pop": 1594605, "is_dc": false}, {"name": "Tucson, AZ", "short_name": "Tucson", "rent": 41.7, "permits": 0.0, "wfh": 12.9, "pop": 466936, "is_dc": false}, {"name": "Tulsa, OK", "short_name": "Tulsa", "rent": 43.7, "permits": 0.0, "wfh": 9.9, "pop": 523918, "is_dc": false}, {"name": "Urban Honolulu, HI", "short_name": "Urban Honolulu", "rent": 31.4, "permits": 0.0, "wfh": 7.5, "pop": 475372, "is_dc": false}, {"name": "Virginia Beach, VA", "short_name": "Virginia Beach", "rent": 49.0, "permits": 15.1, "wfh": 10.4, "pop": 812617, "is_dc": false}, {"name": "Washington, DC", "short_name": "D.C.", "rent": 23.7, "permits": 25.7, "wfh": 21.2, "pop": 3311535, "is_dc": true}];

const W = 900, H = 500;
const margin = {top: 40, right: 30, bottom: 55, left: 50};
const gap = 60;
const panelW = (W - margin.left - margin.right - gap) / 2;
const panelH = H - margin.top - margin.bottom;

const svg = d3.select("#chart").append("svg")
    .attr("width", W).attr("height", H);

const tooltip = d3.select("#tooltip");

// Shared Y scale (rent growth)
const yExtent = d3.extent(DATA, d => d.rent);
const yPad = (yExtent[1] - yExtent[0]) * 0.08;
const y = d3.scaleLinear()
    .domain([yExtent[0] - yPad, yExtent[1] + yPad])
    .range([panelH, 0]);

// Population-scaled radius
const popExtent = d3.extent(DATA, d => d.pop);
const rScale = d3.scaleSqrt()
    .domain([popExtent[0], popExtent[1]])
    .range([3, 18]);

// Panel configs
const panels = [
    {
        key: "permits",
        title: "Multifamily permits per 1K workers",
        xField: "permits",
        xLabel: "Cumulative MF permits per 1K workers",
        color: "#3D3733",
        r2Label: "r = −0.51"
    },
    {
        key: "wfh",
        title: "Work-from-home share",
        xField: "wfh",
        xLabel: "Average WFH share (%)",
        color: "#0BB4FF",
        r2Label: "r = −0.55"
    }
];

panels.forEach((panel, pi) => {
    const x0 = margin.left + pi * (panelW + gap);
    const g = svg.append("g").attr("transform", `translate(${x0}, ${margin.top})`);

    // X scale
    const xExtent = d3.extent(DATA, d => d[panel.xField]);
    const xPad = (xExtent[1] - xExtent[0]) * 0.08;
    const x = d3.scaleLinear()
        .domain([Math.max(0, xExtent[0] - xPad), xExtent[1] + xPad])
        .range([0, panelW]);

    // Gridlines
    y.ticks(6).forEach(t => {
        g.append("line")
            .attr("x1", 0).attr("x2", panelW)
            .attr("y1", y(t)).attr("y2", y(t))
            .attr("stroke", "#D8DAD1").attr("stroke-width", 0.5);
    });

    // Regression line
    const xMean = d3.mean(DATA, d => d[panel.xField]);
    const yMean = d3.mean(DATA, d => d.rent);
    let num = 0, den = 0;
    DATA.forEach(d => {
        num += (d[panel.xField] - xMean) * (d.rent - yMean);
        den += (d[panel.xField] - xMean) ** 2;
    });
    const slope = num / den;
    const intercept = yMean - slope * xMean;
    const xDom = x.domain();
    g.append("line")
        .attr("x1", x(xDom[0])).attr("y1", y(intercept + slope * xDom[0]))
        .attr("x2", x(xDom[1])).attr("y2", y(intercept + slope * xDom[1]))
        .attr("stroke", panel.color).attr("stroke-width", 1.5)
        .attr("opacity", 0.4).attr("stroke-dasharray", "6,3");

    // Sort so smaller bubbles draw on top
    const sorted = [...DATA].sort((a, b) => b.pop - a.pop);

    // Bubbles
    g.selectAll(".dot")
        .data(sorted)
        .join("circle")
        .attr("cx", d => x(d[panel.xField]))
        .attr("cy", d => y(d.rent))
        .attr("r", d => d.is_dc ? rScale(d.pop) : rScale(d.pop))
        .attr("fill", d => d.is_dc ? "#F4743B" : panel.color)
        .attr("opacity", d => d.is_dc ? 0.7 : 0.3)
        .attr("stroke", d => d.is_dc ? "#F4743B" : panel.color)
        .attr("stroke-width", d => d.is_dc ? 1.5 : 0.5)
        .attr("stroke-opacity", d => d.is_dc ? 1 : 0.4)
        .on("mouseover", (event, d) => {
            tooltip.html(
                `<strong>${d.name}</strong><br>` +
                `Rent growth: +${d.rent}%<br>` +
                `Permits/1K: ${d.permits}<br>` +
                `WFH share: ${d.wfh}%<br>` +
                `Employed pop: ${(d.pop / 1e6).toFixed(1)}M`
            )
            .style("left", (event.pageX + 12) + "px")
            .style("top", (event.pageY - 28) + "px")
            .style("opacity", 1);
        })
        .on("mouseout", () => tooltip.style("opacity", 0));

    // DC label
    const dc = DATA.find(d => d.is_dc);
    g.append("text")
        .attr("x", x(dc[panel.xField]) + rScale(dc.pop) + 4)
        .attr("y", y(dc.rent) + 4)
        .attr("font-size", 11).attr("font-weight", 500)
        .attr("fill", "#F4743B")
        .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif")
        .text("D.C.");

    // Panel title
    g.append("text")
        .attr("x", panelW / 2).attr("y", -12)
        .attr("text-anchor", "middle")
        .attr("font-size", 14).attr("font-weight", 500).attr("fill", "#3D3733")
        .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif")
        .text(panel.title);

    // Correlation label
    g.append("text")
        .attr("x", panelW - 5).attr("y", 20)
        .attr("text-anchor", "end")
        .attr("font-size", 12).attr("font-weight", 400).attr("fill", panel.color)
        .attr("opacity", 0.7)
        .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif")
        .text(panel.r2Label);

    // X axis
    const xAxis = d3.axisBottom(x).ticks(5).tickSize(4);
    g.append("g")
        .attr("transform", `translate(0,${panelH})`)
        .call(xAxis)
        .call(g => g.select(".domain").attr("stroke", "#ccc"))
        .call(g => g.selectAll("text")
            .attr("font-size", 11).attr("fill", "#3D3733")
            .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif"));

    // X axis label
    g.append("text")
        .attr("x", panelW / 2).attr("y", panelH + 40)
        .attr("text-anchor", "middle")
        .attr("font-size", 11).attr("fill", "#3D3733").attr("opacity", 0.6)
        .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif")
        .text(panel.xLabel);

    // Y axis
    if (pi === 0) {
        const yAxis = d3.axisLeft(y).ticks(6).tickSize(0)
            .tickFormat((d, i, nodes) => i === nodes.length - 1 ? d + "%" : d);
        g.append("g")
            .call(yAxis)
            .call(g => g.select(".domain").remove())
            .call(g => g.selectAll("text")
                .attr("font-size", 11).attr("fill", "#3D3733")
                .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif"));

        g.append("text")
            .attr("transform", "rotate(-90)")
            .attr("x", -panelH / 2).attr("y", -38)
            .attr("text-anchor", "middle")
            .attr("font-size", 11).attr("fill", "#3D3733").attr("opacity", 0.6)
            .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif")
            .text("Cumulative rent growth (%)");
    } else {
        const yAxis = d3.axisLeft(y).ticks(6).tickSize(0)
            .tickFormat((d, i, nodes) => i === nodes.length - 1 ? d + "%" : d);
        g.append("g")
            .call(yAxis)
            .call(g => g.select(".domain").remove())
            .call(g => g.selectAll("text")
                .attr("font-size", 11).attr("fill", "#3D3733").attr("opacity", 0.4)
                .style("font-family", "'ABC Oracle Edu', system-ui, sans-serif"));
    }
});
