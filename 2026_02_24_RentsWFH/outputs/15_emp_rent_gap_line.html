const margin = {top: 50, right: 60, bottom: 50, left: 55};

const plotH = H - margin.top - margin.bottom;

    .domain(d3.extent(DATA, d => d.date))
    .range([0, plotW]);

    .domain([yMin - yPad, yMax + yPad])
    .range([plotH, 0]);

    g.append("line")
        .attr("x1", 0).attr("x2", plotW)
        .attr("y1", y(t)).attr("y2", y(t))
        .attr("stroke", "#D8DAD1").attr("stroke-width", 0.5);
});

// Zero line

    .attr("x1", 0).attr("x2", plotW)
    .attr("y1", y(0)).attr("y2", y(0))
    .attr("stroke", "#3D3733").attr("stroke-width", 1).attr("opacity", 0.4);

    .data(DATA)
    .join("rect")
    .attr("class", "emp-bar")
    .attr("x", d => x(d.date) - barWidth / 2)
    .attr("y", d => d.emp_gap >= 0 ? y(d.emp_gap) : y(0))
    .attr("width", barWidth)
    .attr("height", d => Math.abs(y(d.emp_gap) - y(0)))
    .attr("fill", d => d.emp_gap >= 0 ? "#0BB4FF" : "#3D3733")
    .attr("opacity", 0.5);

// Rent gap line
const rentLine = d3.line()
    .x(d => x(d.date))
    .y(d => y(d.rent_gap))
    .curve(d3.curveMonotoneX);

    .datum(DATA)
    .attr("d", rentLine)
    .attr("fill", "none")
    .attr("stroke", "#F4743B")
    .attr("stroke-width", 2.5);

// X axis

    .attr("transform", `translate(0,${plotH})`)
    .call(xAxis)

// Y axis

        return d;
    });
g.append("g")
    .call(yAxisFn)
    .call(g => g.select(".domain").remove())
    .call(g => g.selectAll("text").attr("fill", "#3D3733").attr("font-size", 11).style("font-family", "'ABC Oracle Edu', system-ui, sans-serif"));

// Tooltip
const tooltip = d3.select("#tooltip");
svg.on("mousemove", function(event) {
    const [mx, my] = d3.pointer(event);
    const px = mx - margin.left;
    const py = my - margin.top;
    if (px < 0 || px > plotW || py < 0 || py > plotH) {
        tooltip.style("opacity", 0);
        return;
    }
    const dateAtMouse = x.invert(px);
    const bisect = d3.bisector(d => d.date).left;
    const idx = Math.min(bisect(DATA, dateAtMouse), DATA.length - 1);
    const d = DATA[idx];
    tooltip.html(
        `<strong>${d3.timeFormat("%b %Y")(d.date)}</strong><br>` +
        `Rent gap: ${d.rent_gap > 0 ? "+" : ""}${d.rent_gap.toFixed(1)}pp<br>` +
        `Employment gap: ${d.emp_gap > 0 ? "+" : ""}${d.emp_gap.toFixed(1)}pp`
    )
    .style("left", (event.pageX + 14) + "px")
    .style("top", (event.pageY - 30) + "px")
    .style("opacity", 1);
}).on("mouseout", () => tooltip.style("opacity", 0));
