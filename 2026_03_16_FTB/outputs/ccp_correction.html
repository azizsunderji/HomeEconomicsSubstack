<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

// --- DATA ---
const ccpData = [
  { year: 2000, obs_median: 35, corrected_median: 32.5 },
  { year: 2001, obs_median: 35, corrected_median: 33.2 },
  { year: 2002, obs_median: 34, corrected_median: 33.0 },
  { year: 2003, obs_median: 34, corrected_median: 33.9 },
  { year: 2004, obs_median: 34, corrected_median: 34.0 },
  { year: 2005, obs_median: 34, corrected_median: 34.1 },
  { year: 2006, obs_median: 34, corrected_median: 34.5 },
  { year: 2007, obs_median: 34, corrected_median: 34.5 },
  { year: 2008, obs_median: 33, corrected_median: 34.4 },
  { year: 2009, obs_median: 32, corrected_median: 33.9 },
  { year: 2010, obs_median: 32, corrected_median: 33.5 },
  { year: 2011, obs_median: 32, corrected_median: 34.7 },
  { year: 2012, obs_median: 32, corrected_median: 34.2 },
  { year: 2013, obs_median: 32, corrected_median: 34.5 },
  { year: 2014, obs_median: 32, corrected_median: 34.6 },
  { year: 2015, obs_median: 32, corrected_median: 34.1 },
  { year: 2016, obs_median: 32, corrected_median: 34.3 },
  { year: 2017, obs_median: 32, corrected_median: 34.2 },
  { year: 2018, obs_median: 33, corrected_median: 34.5 },
  { year: 2019, obs_median: 33, corrected_median: 34.6 },
  { year: 2020, obs_median: 33, corrected_median: 35.2 },
  { year: 2021, obs_median: 34, corrected_median: 35.3 },
  { year: 2022, obs_median: 34, corrected_median: 35.4 },
  { year: 2023, obs_median: 33, corrected_median: 35.0 },
  { year: 2024, obs_median: 33, corrected_median: 35.3 },
  { year: 2025, obs_median: 34, corrected_median: 35.5 }
];

const psidData = [
  { year: 1999, smoothed: 32.59 },
  { year: 2001, smoothed: 32.60 },
  { year: 2003, smoothed: 33.17 },
  { year: 2005, smoothed: 33.14 },
  { year: 2007, smoothed: 33.08 },
  { year: 2009, smoothed: 33.23 },
  { year: 2011, smoothed: 33.23 },
  { year: 2013, smoothed: 33.00 },
  { year: 2015, smoothed: 33.44 },
  { year: 2017, smoothed: 34.46 },
  { year: 2019, smoothed: 34.76 },
  { year: 2021, smoothed: 35.16 },
  { year: 2023, smoothed: 35.53 }
];

// --- DIMENSIONS ---
const W = 960, H = 987;
const buffer = 40;
const gridLeftEdge = buffer;
const gridRightEdge = W - buffer;

// Layout system
const titleY = 40 + 32;
const subtitleY = titleY + 34;
const gapSubtitleToChart = 75;
const chartTop = subtitleY + gapSubtitleToChart;

// Source block from bottom
const sourceLineH = 18;
const sourceLines = 2;
const sourceBlockH = sourceLineH * sourceLines;
const sourceBottom = H - buffer;
const sourceTop = sourceBottom - sourceBlockH;

const gapXaxisToSource = 45;
const chartBottom = sourceTop - gapXaxisToSource - 40; // 40 for x-axis labels+ticks

// --- SCALES ---
const xScale = d3.scaleLinear()
  .domain([1999, 2026])
  .range([gridLeftEdge, gridRightEdge]);

const yScale = d3.scaleLinear()
  .domain([30, 38])
  .range([chartBottom, chartTop]);

// --- SVG ---
const svg = d3.select("body").append("svg")
  .attr("width", W)
  .attr("height", H)
  .attr("viewBox", `0 0 ${W} ${H}`);

// Background
svg.append("rect")
  .attr("width", W)
  .attr("height", H)
  .attr("fill", "#F6F7F3");

// --- TITLE ---
svg.append("text")
  .attr("x", gridLeftEdge)
  .attr("y", titleY)
  .attr("font-family", "ABC Oracle Edu")
  .attr("font-size", "32px")
  .attr("font-weight", 500)
  .attr("fill", "#3D3733")
  .text("Correcting the Fed\u2019s FTB age estimate");

// --- SUBTITLE ---
svg.append("text")
  .attr("x", gridLeftEdge)
  .attr("y", subtitleY)
  .attr("font-family", "ABC Oracle Edu")
  .attr("font-size", "23px")
  .attr("font-weight", 400)
  .attr("fill", "#7F7570")
  .text("CCP observed vs. corrected for misclassification and cash buyer exclusion");

// --- GRIDLINES ---
const yTicks = [30, 32, 34, 36, 38];
const gridG = svg.append("g").attr("id", "grid-lines");
yTicks.forEach(t => {
  gridG.append("line")
    .attr("x1", gridLeftEdge)
    .attr("x2", gridRightEdge)
    .attr("y1", yScale(t))
    .attr("y2", yScale(t))
    .attr("stroke", "#e1e2e3")
    .attr("stroke-width", 1);
});

// --- Y-AXIS LABELS ---
const yLabelsG = svg.append("g").attr("id", "y-axis-labels");
yTicks.forEach((t, i) => {
  const label = (i === yTicks.length - 1) ? t + " yrs" : String(t);
  yLabelsG.append("text")
    .attr("x", gridLeftEdge)
    .attr("y", yScale(t))
    .attr("dy", "-0.35em")
    .attr("font-family", "ABC Oracle Edu")
    .attr("font-size", "22px")
    .attr("font-weight", 300)
    .attr("fill", "#333")
    .attr("text-anchor", "start")
    .text(label);
});

// --- X-AXIS ---
const xTicks = [2000, 2005, 2010, 2015, 2020, 2025];
const xTickLabels = ["2000", "\u201905", "\u201910", "\u201915", "\u201920", "\u201925"];

const xTicksG = svg.append("g").attr("id", "x-axis-ticks");
const xLabelsG = svg.append("g").attr("id", "x-axis-labels");

xTicks.forEach((t, i) => {
  const x = xScale(t);
  xTicksG.append("line")
    .attr("x1", x)
    .attr("x2", x)
    .attr("y1", chartBottom)
    .attr("y2", chartBottom + 12)
    .attr("stroke", "#3D3733")
    .attr("stroke-width", 0.5);

  xLabelsG.append("text")
    .attr("x", x)
    .attr("y", chartBottom + 12)
    .attr("dy", "1.5em")
    .attr("font-family", "ABC Oracle Edu")
    .attr("font-size", "22px")
    .attr("font-weight", 300)
    .attr("fill", "#333")
    .attr("text-anchor", "middle")
    .text(xTickLabels[i]);
});

// --- LINE GENERATORS ---
const lineGen = d3.line()
  .x(d => xScale(d.year))
  .curve(d3.curveMonotoneX);

// --- DATA SERIES ---
const seriesG = svg.append("g").attr("id", "data-series");

// CCP Observed
seriesG.append("path")
  .datum(ccpData)
  .attr("d", lineGen.y(d => yScale(d.obs_median)))
  .attr("fill", "none")
  .attr("stroke", "#F4743B")
  .attr("stroke-width", 2.5)
  .style("mix-blend-mode", "multiply");

// CCP Corrected
seriesG.append("path")
  .datum(ccpData)
  .attr("d", lineGen.y(d => yScale(d.corrected_median)))
  .attr("fill", "none")
  .attr("stroke", "#0BB4FF")
  .attr("stroke-width", 2.5)
  .style("mix-blend-mode", "multiply");

// PSID (dashed)
seriesG.append("path")
  .datum(psidData)
  .attr("d", lineGen.y(d => yScale(d.smoothed)))
  .attr("fill", "none")
  .attr("stroke", "#3D3733")
  .attr("stroke-width", 2.5)
  .attr("stroke-dasharray", "8,5")
  .style("mix-blend-mode", "multiply");

// --- INLINE LABELS ---
function addLabel(id, text, x, y, color) {
  const g = svg.append("g").attr("id", id);
  // Halo
  g.append("text")
    .attr("x", x)
    .attr("y", y)
    .attr("font-family", "ABC Oracle Edu")
    .attr("font-size", "16px")
    .attr("font-weight", 500)
    .attr("fill", "#F6F7F3")
    .attr("stroke", "#F6F7F3")
    .attr("stroke-width", 5)
    .attr("stroke-linejoin", "round")
    .attr("paint-order", "stroke")
    .text(text);
  // Text
  g.append("text")
    .attr("x", x)
    .attr("y", y)
    .attr("font-family", "ABC Oracle Edu")
    .attr("font-size", "16px")
    .attr("font-weight", 500)
    .attr("fill", color)
    .text(text);
}

// Position labels near right end of each line
// CCP observed: last point is (2025, 34)
const obsLastY = yScale(ccpData[ccpData.length - 1].obs_median);
const corrLastY = yScale(ccpData[ccpData.length - 1].corrected_median);
const psidLastY = yScale(psidData[psidData.length - 1].smoothed);

// Place labels to the left of the last data point, offset vertically for readability
const labelX = xScale(2021);

addLabel("label-ccp-observed", "CCP observed", labelX, obsLastY + 20, "#F4743B");
addLabel("label-ccp-corrected", "CCP corrected", labelX - 30, corrLastY - 12, "#0BB4FF");
addLabel("label-psid", "PSID", labelX + 100, psidLastY - 14, "#3D3733");

// --- SOURCE NOTE ---
const sourceG = svg.append("g").attr("id", "source");
const sourceText = sourceG.append("text")
  .attr("x", gridLeftEdge)
  .attr("y", sourceTop)
  .attr("font-family", "ABC Oracle Edu")
  .attr("font-size", "15px")
  .attr("font-weight", 200)
  .attr("fill", "#3D3733");

sourceText.append("tspan")
  .attr("x", gridLeftEdge)
  .text("Sources: NY Fed Consumer Credit Panel/Equifax (observed); PSID (weighted median, 5-survey rolling avg).");

sourceText.append("tspan")
  .attr("x", gridLeftEdge)
  .attr("dy", sourceLineH)
  .text("CCP corrected for misclassified prior owners (~36% in 2000, decaying) and cash buyer exclusion (~21% in 2025).");

// --- LOGO ---
const logoWidth = 130;
const logoAspect = 1022 / 254; // approximate from the PNG dimensions
const logoHeight = logoWidth / logoAspect;
const logoX = gridRightEdge - logoWidth;
const logoY = sourceTop + sourceBlockH - logoHeight;

svg.append("g").attr("id", "logo")
  .append("image")
  .attr("x", logoX)
  .attr("y", logoY)
  .attr("width", logoWidth)
  .attr("height", logoHeight)
