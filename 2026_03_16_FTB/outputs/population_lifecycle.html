const data = [{"year": 1976, "children": 31.0, "adult_dependent": 12.2, "unmarried_renter": 6.5, "unmarried_owner": 5.3, "married_renter": 11.0, "married_owner": 34.2}, {"year": 1980, "children": 28.4, "adult_dependent": 13.3, "unmarried_renter": 7.0, "unmarried_owner": 6.8, "married_renter": 8.9, "married_owner": 35.6}, {"year": 1985, "children": 26.8, "adult_dependent": 14.7, "unmarried_renter": 8.2, "unmarried_owner": 7.0, "married_renter": 9.8, "married_owner": 33.5}, {"year": 1990, "children": 26.1, "adult_dependent": 14.7, "unmarried_renter": 8.7, "unmarried_owner": 7.6, "married_renter": 9.6, "married_owner": 33.3}, {"year": 1995, "children": 26.9, "adult_dependent": 14.8, "unmarried_renter": 8.9, "unmarried_owner": 7.9, "married_renter": 8.7, "married_owner": 32.9}, {"year": 2000, "children": 26.4, "adult_dependent": 15.3, "unmarried_renter": 8.7, "unmarried_owner": 8.8, "married_renter": 7.5, "married_owner": 33.4}, {"year": 2005, "children": 25.3, "adult_dependent": 15.8, "unmarried_renter": 8.5, "unmarried_owner": 9.8, "married_renter": 6.6, "married_owner": 33.9}, {"year": 2010, "children": 24.5, "adult_dependent": 17.3, "unmarried_renter": 9.1, "unmarried_owner": 9.9, "married_renter": 7.3, "married_owner": 32.1}, {"year": 2015, "children": 23.4, "adult_dependent": 18.3, "unmarried_renter": 10.1, "unmarried_owner": 9.6, "married_renter": 8.2, "married_owner": 30.5}, {"year": 2020, "children": 22.8, "adult_dependent": 19.2, "unmarried_renter": 9.4, "unmarried_owner": 10.0, "married_renter": 7.2, "married_owner": 31.5}, {"year": 2025, "children": 21.6, "adult_dependent": 19.9, "unmarried_renter": 10.3, "unmarried_owner": 10.3, "married_renter": 7.0, "married_owner": 31.1}];

const W = 960, H = 987;
const pad = 40;
const titleY = pad + 32;
const subtitleY = titleY + 34;
const chartTop = subtitleY + 75;

const sourceFont = 15, sourceLineH = 18;
const lastSourceBaseline = H - pad;
const firstSourceBaseline = lastSourceBaseline - sourceLineH;

const mLeft = 95, mRight = 40, gridExtendLeft = 55;
const chartLeft = mLeft, chartW = W - mLeft - mRight;
const gridLeftEdge = chartLeft - gridExtendLeft;
const gridRightEdge = chartLeft + chartW;

const legendH = 55;
const chartBottom = firstSourceBaseline - 30 - legendH;
const chartH = chartBottom - chartTop;
const rowH = chartH / data.length;
const barH = Math.min(rowH - 10, 45);

const x = d3.scaleLinear().domain([0, 100]).range([0, chartW]);

const svg = d3.select("body").append("svg").attr("width",W).attr("height",H)
  .attr("font-family","ABC Oracle Edu");
svg.append("rect").attr("width",W).attr("height",H).attr("fill","#F6F7F3");

svg.append("text").attr("x",gridLeftEdge).attr("y",titleY)
  .attr("font-size","32px").attr("font-weight","500").attr("fill","#3D3733")
  .text("Where Americans are in the life cycle");
svg.append("text").attr("x",gridLeftEdge).attr("y",subtitleY)
  .attr("font-size","23px").attr("font-weight","400").attr("fill","#7F7570")
  .text("Share of total population by housing and marital status");

const tx = chartLeft, ty = chartTop;

// Vertical gridlines at 0, 25, 50, 75, 100
[0, 25, 50, 75, 100].forEach(v => {
  svg.append("line")
    .attr("x1",tx+x(v)).attr("x2",tx+x(v))
    .attr("y1",ty).attr("y2",ty+chartH)
    .attr("stroke","#e1e2e3").attr("stroke-width",1);
  svg.append("text").attr("x",tx+x(v)).attr("y",ty-10)
    .attr("text-anchor","middle").attr("font-size","18px").attr("fill","#333")
    .attr("font-weight","300").text(v + "%");
});

const segments = [
  {key:"children", color:"#DADFCE", label:"Children (<18)", textColor:"#3D3733"},
  {key:"adult_dependent", color:"#C6DCCB", label:"Adults with parents/others", textColor:"#3D3733"},
  {key:"unmarried_renter", color:"#67A275", label:"Unmarried, renting", textColor:"white"},
  {key:"unmarried_owner", color:"#0BB4FF", label:"Unmarried, owning", textColor:"white"},
  {key:"married_renter", color:"#F4743B", label:"Married, renting", textColor:"white"},
  {key:"married_owner", color:"#0077CC", label:"Married, owning", textColor:"white"},
];

data.forEach((d,i) => {
  const rowTop = ty + i * rowH;
  const rowCenter = rowTop + rowH / 2;
  const barY = rowCenter - barH / 2;

  // Year label
  svg.append("text").attr("x",tx-15).attr("y",rowCenter+6)
    .attr("text-anchor","end").attr("font-size","20px").attr("font-weight","500")
    .attr("fill","#3D3733").text(d.year);

  // Stacked segments
  let cumX = 0;
  segments.forEach(seg => {
    const val = d[seg.key];
    const segW = x(val);

    if (segW > 0) {
      svg.append("rect")
        .attr("x",tx + x(cumX)).attr("y",barY)
        .attr("width",segW).attr("height",barH)
        .attr("fill",seg.color);

      // Percentage label if wide enough
      if (segW > 28) {
        svg.append("text")
          .attr("x",tx + x(cumX) + segW/2).attr("y",rowCenter + 4)
          .attr("text-anchor","middle").attr("font-size","12px").attr("font-weight","500")
          .attr("fill",seg.textColor).text(Math.round(val) + "%");
      }
    }
    cumX += val;
  });
});

// Legend — two rows of 3
const legY = chartBottom + 15;
segments.forEach((seg,i) => {
  const row = Math.floor(i / 3);
  const col = i % 3;
  const lx = gridLeftEdge + col * 290;
  const ly = legY + row * 22;
  svg.append("rect").attr("x",lx).attr("y",ly-8).attr("width",14).attr("height",14)
    .attr("fill",seg.color).attr("rx",2);
  svg.append("text").attr("x",lx+20).attr("y",ly+5)
    .attr("font-size","14px").attr("font-weight","300").attr("fill","#3D3733").text(seg.label);
});

// Source
svg.append("text").attr("x",gridLeftEdge).attr("y",firstSourceBaseline)
  .attr("font-size","15px").attr("font-weight","200").attr("fill","#3D3733")
  .text("Source: CPS ASEC, author\u2019s calculations. Total U.S. population.");
svg.append("text").attr("x",gridLeftEdge).attr("y",lastSourceBaseline)
  .attr("font-size","15px").attr("font-weight","200").attr("fill","#3D3733")
  .text("Head/spouse status determines household formation. Married includes spouse present/absent.");
