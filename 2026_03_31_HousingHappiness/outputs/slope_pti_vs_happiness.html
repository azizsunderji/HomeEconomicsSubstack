const ptiTicks = [-50, -40, -30, -20, -10, 0, 10, 20, 30, 40, 50];

// Grid lines for left axis
ptiTicks.forEach(t => {
  const y = yLeft(t);
  if (y >= chartTop && y <= chartBottom) {
    svg.append('line')
      .attr('x1', leftAxisX - 25)
      .attr('x2', leftAxisX + 25)
      .attr('y1', y).attr('y2', y)
      .attr('stroke', grid)
      .attr('stroke-width', t === 0 ? 0 : 0.5);
  }
});

// Grid lines for right axis
hapTicks.forEach(t => {
  const y = yRight(t);
  if (y >= chartTop && y <= chartBottom) {
    svg.append('line')
      .attr('x1', rightAxisX - 25)
      .attr('x2', rightAxisX + 25)
      .attr('y1', y).attr('y2', y)
      .attr('stroke', grid)
      .attr('stroke-width', Math.abs(t) < 0.001 ? 0 : 0.5);
  }
});

// Zero reference lines (dashed)
[yLeft(0)].forEach(y => {
  svg.append('line')
    .attr('x1', leftAxisX - 25).attr('x2', leftAxisX + 25)

// Right axis labels

// Top 10 by PTI change (biggest increases)
const top10Set = new Set([
  'Portugal', 'Canada', 'Netherlands', 'Luxembourg', 'United States',
  'Ireland', 'Australia', 'Switzerland', 'Czechia', 'Hungary'
]);

// Countries to label: top 10 + any Anglo not in top 10 (NZ, UK)
const labelSet = new Set([
  ...top10Set,
  'New Zealand', 'United Kingdom'
]);

// Short names
const shortNames = {
  'United States': 'U.S.',
  'United Kingdom': 'U.K.',
  'New Zealand': 'N.Z.',
  'Republic of Korea': 'S. Korea',
  'South Africa': 'S. Africa'
};
function sn(c) { return shortNames[c] || c; }

// Draw lines - background (non-top-10) first, then top-10 on top
const bgCountries = data.filter(d => !top10Set.has(d.country));
const fgCountries = data.filter(d => top10Set.has(d.country));

bgCountries.forEach(d => {
  const color = d.anglo ? red : blue;
  svg.append('line')
    .attr('x1', leftAxisX).attr('y1', yLeft(d.pti_change))
    .attr('x2', rightAxisX).attr('y2', yRight(d.happiness_change))
    .attr('stroke', color)
    .attr('stroke-width', 1)
    .attr('opacity', 0.3)
    .style('mix-blend-mode', 'multiply');
});

fgCountries.forEach(d => {
  const color = d.anglo ? red : blue;
  svg.append('line')
    .attr('x1', leftAxisX).attr('y1', yLeft(d.pti_change))
    .attr('x2', rightAxisX).attr('y2', yRight(d.happiness_change))

    .attr('stroke-width', 2.5)
    .style('mix-blend-mode', 'multiply');
});

// Dots
data.forEach(d => {
  const color = d.anglo ? red : blue;
  const isTop = top10Set.has(d.country);
  const op = isTop ? 1 : 0.3;
  const r = isTop ? 4 : 3;
  svg.append('circle').attr('cx', leftAxisX).attr('cy', yLeft(d.pti_change)).attr('r', r).attr('fill', color).attr('opacity', op);
  svg.append('circle').attr('cx', rightAxisX).attr('cy', yRight(d.happiness_change)).attr('r', r).attr('fill', color).attr('opacity', op);
});

// Label function with halo
function addLabel(text, x, y, anchor, color, bold) {
  const fw = bold ? 700 : 400;
  svg.append('text')
    .attr('x', x).attr('y', y)
    .attr('text-anchor', anchor).attr('dy', '0.35em')
    .attr('font-size', '12px').attr('font-weight', fw)
    .attr('font-family', ff)
    .attr('fill', bg).attr('stroke', bg).attr('stroke-width', 4).attr('stroke-linejoin', 'round')
    .text(text);
  svg.append('text')
    .attr('x', x).attr('y', y)
    .attr('text-anchor', anchor).attr('dy', '0.35em')
    .attr('font-size', '12px').attr('font-weight', fw)
    .attr('font-family', ff)
    .attr('fill', color)
    .text(text);
}

// Collision avoidance for labels
// Collect raw positions, then nudge apart
const leftLabels = [];
const rightLabels = [];

data.forEach(d => {
  if (!labelSet.has(d.country)) return;
  const color = d.anglo ? red : blue;
  const name = sn(d.country);
  const isTop = top10Set.has(d.country);
  leftLabels.push({ name, y: yLeft(d.pti_change), color, bold: isTop });
  rightLabels.push({ name, y: yRight(d.happiness_change), color, bold: isTop });
});

// Sort by y position and push overlapping labels apart
function resolveCollisions(labels, minGap) {
  labels.sort((a, b) => a.y - b.y);
  let changed = true;
  let iterations = 0;
  while (changed && iterations < 50) {
    changed = false;
    iterations++;
    for (let i = 1; i < labels.length; i++) {
      const gap = labels[i].y - labels[i-1].y;
      if (gap < minGap) {
        const shift = (minGap - gap) / 2;
        labels[i-1].y -= shift;
        labels[i].y += shift;
        changed = true;
      }
    }
  }
}

resolveCollisions(leftLabels, 16);
resolveCollisions(rightLabels, 16);

// Render left labels
leftLabels.forEach(l => {
  addLabel(l.name, leftAxisX - 35, l.y, 'end', l.color, l.bold);
});

// Render right labels
rightLabels.forEach(l => {
  addLabel(l.name, rightAxisX + 35, l.y, 'start', l.color, l.bold);
});
