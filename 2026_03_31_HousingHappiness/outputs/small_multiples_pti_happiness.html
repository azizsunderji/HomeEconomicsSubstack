const W=960, H=1800, buf=40, ff='ABC Oracle Edu';
const ink='#3D3733', bg='#F6F7F3', red='#F4743B', blue='#0BB4FF';
const subC='#7F7570', grid='#e1e2e3';

const svg = d3.select('body').append('svg')
  .attr('width',W).attr('height',H).attr('viewBox',`0 0 ${W} ${H}`)
  .style('font-family',ff);
svg.append('rect').attr('width',W).attr('height',H).attr('fill',bg);

const titleY = buf+32;
svg.append('text').attr('x',buf).attr('y',titleY)
  .attr('font-size','32px').attr('font-weight',500).attr('fill',ink).attr('font-family',ff)
  .text('Housing costs and happiness, country by country');
const subtitleY = titleY+34;
svg.append('text').attr('x',buf).attr('y',subtitleY)
  .attr('font-size','23px').attr('font-weight',400).attr('fill',subC).attr('font-family',ff)
  .text('Sorted by change in happiness. PTI (blue) and happiness (black).');

// Legend
const legY = subtitleY + 32;
svg.append('line').attr('x1',buf).attr('x2',buf+30).attr('y1',legY).attr('y2',legY)
  .attr('stroke',blue).attr('stroke-width',2);
svg.append('text').attr('x',buf+36).attr('y',legY).attr('dy','0.35em')
  .attr('font-size','16px').attr('font-weight',500).attr('fill',ink).attr('font-family',ff)
  .text('Price-to-income index');
svg.append('line').attr('x1',buf+230).attr('x2',buf+260).attr('y1',legY).attr('y2',legY)
  .attr('stroke',ink).attr('stroke-width',2);
svg.append('text').attr('x',buf+266).attr('y',legY).attr('dy','0.35em')
  .attr('font-size','16px').attr('font-weight',500).attr('fill',ink).attr('font-family',ff)
  .text('Happiness');

const cols = 6, rowsNeeded = Math.ceil(data.length / cols);
const gridTop = legY + 35;
const gridBottom = H - buf - 40;
const cellW = (W - 2*buf) / cols;
const cellH = (gridBottom - gridTop) / rowsNeeded;
const cellPad = 6;

// Shared scales — rebased so both start at 0
// PTI: ~-50 to +55, Happiness: ~-0.8 to +1.8
// Use SAME vertical mapping so slopes are comparable
// Map so that a 10-point PTI change = same visual height as a 0.3-point happiness change
// (rough ratio: PTI range ~100, hap range ~2.6, ratio ~38:1)
const xScale = d3.scaleLinear().domain([2011, 2025]);

data.forEach((d, i) => {
  const col = i % cols;
  const row = Math.floor(i / cols);
  const cx = buf + col * cellW + cellPad;
  const cy = gridTop + row * cellH + cellPad;
  const cw = cellW - 2*cellPad;
  const ch = cellH - 2*cellPad - 14;
  
  const xS = xScale.copy().range([cx, cx+cw]);
  // Shared y-scale: both rebased to 0 at start
  // PTI uses left scale, happiness uses right
  // But we need them on same visual axis to compare slopes
  // Use dual y: PTI range [-55, 60], Happiness range [-1, 2]
  const yP = d3.scaleLinear().domain([-55, 60]).range([cy+ch, cy+12]);
  const yH = d3.scaleLinear().domain([-55/60*2, 2]).range([cy+ch, cy+12]); // align zeros
  
  // Cell background
  svg.append('rect').attr('x',cx).attr('y',cy).attr('width',cw).attr('height',ch+12)
    .attr('fill','white').attr('rx',3).attr('opacity',0.5);
  
  // Zero line
  svg.append('line').attr('x1',cx).attr('x2',cx+cw)
    .attr('y1',yP(0)).attr('y2',yP(0))
    .attr('stroke',grid).attr('stroke-width',0.5);
  
  // Country label
  const labelColor = d.anglo ? red : ink;
  const labelWt = d.anglo ? 700 : 500;
  svg.append('text').attr('x',cx+2).attr('y',cy+10)
    .attr('font-size','10px').attr('font-weight',labelWt).attr('fill',labelColor).attr('font-family',ff)
    .text(d.short);
  
  // PTI line
  const ptiPts = d.series.filter(s => s.pti !== null);
  if(ptiPts.length > 1) {
    const ptiLine = d3.line().x(s => xS(s.year)).y(s => yP(s.pti)).curve(d3.curveMonotoneX);
    svg.append('path').attr('d',ptiLine(ptiPts))
      .attr('fill','none').attr('stroke',blue).attr('stroke-width',1.5).attr('opacity',0.6);
  }
  
  // Happiness line
  const hapPts = d.series.filter(s => s.happiness !== null);
  if(hapPts.length > 1) {
    const hapLine = d3.line().x(s => xS(s.year)).y(s => yH(s.happiness)).curve(d3.curveMonotoneX);
    const lineColor = ink;
    svg.append('path').attr('d',hapLine(hapPts))
      .attr('fill','none').attr('stroke',lineColor).attr('stroke-width',1.5);
  }
});
