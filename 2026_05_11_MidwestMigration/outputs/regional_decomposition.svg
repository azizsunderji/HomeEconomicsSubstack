   <text style="fill: #3d3733; font: 700 16px 'ABC Oracle Edu'; text-anchor: start" x="7.2" y="18.64" transform="rotate(-0 7.2 18.64)">Each region got there a different way</text>
  </g>
  <g id="text_16">
   <text style="fill: #3d3733; opacity: 0.78; font: 10.5px 'ABC Oracle Edu'" transform="translate(7.2 34.5075)">Change in annual net migration between 2014–18 and 2021–24 averages, by census region.</text>
   <text style="fill: #3d3733; opacity: 0.78; font: 10.5px 'ABC Oracle Edu'" transform="translate(7.2 46.0365)">South: more arriving. Midwest: fewer leaving. Northeast: more arriving (and more leaving).</text>
   <text style="fill: #3d3733; opacity: 0.78; font: 10.5px 'ABC Oracle Edu'" transform="translate(7.2 57.5655)">West: massively more leaving (and fewer arriving) — the mirror of the Midwest.</text>
  </g>
  <g id="text_17">
   <text style="fill: #3d3733; font: 10px 'ABC Oracle Edu'; text-anchor: start" x="68.976" y="370.01" transform="rotate(-0 68.976 370.01)">Fewer leaving</text>
  </g>
  <g id="text_18">
   <text style="fill: #3d3733; font: 10px 'ABC Oracle Edu'; text-anchor: start" x="227.376" y="370.01" transform="rotate(-0 227.376 370.01)">More arriving</text>
  </g>
  <g id="text_19">
   <text style="fill: #3d3733; font: 700 10px 'ABC Oracle Edu'; text-anchor: start" x="371.52" y="370.199844" transform="rotate(-0 371.52 370.199844)">|  Net change</text>
  </g>
  <g id="text_20">
   <text style="fill: #3d3733; opacity: 0.55; font: 9px 'ABC Oracle Edu'; text-anchor: start" x="7.2" y="385.38" transform="rotate(-0 7.2 385.38)">Source: Census Bureau ACS state-to-state migration matrix · inter-region moves only · period averages.</text>
