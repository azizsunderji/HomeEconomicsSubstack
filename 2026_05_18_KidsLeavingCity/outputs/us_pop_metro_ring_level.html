<!DOCTYPE html><html><head><meta charset="utf-8">
<title>U.S. population by metropolitan ring, 1910–2020</title>
<style>
@font-face { font-family:'ABC Oracle Edu'; src:url('file:///Users/azizsunderji/Dropbox/Home%20Economics/Brand%20Assets/OracleFont/Oracle%20Aziz%20Sunderji/Desktop/ABCOracle-Thin.otf') format('opentype'); font-weight:200; }
@font-face { font-family:'ABC Oracle Edu'; src:url('file:///Users/azizsunderji/Dropbox/Home%20Economics/Brand%20Assets/OracleFont/Oracle%20Aziz%20Sunderji/Desktop/ABCOracle-Light.otf') format('opentype'); font-weight:300; }
@font-face { font-family:'ABC Oracle Edu'; src:url('file:///Users/azizsunderji/Dropbox/Home%20Economics/Brand%20Assets/OracleFont/Oracle%20Aziz%20Sunderji/Desktop/ABCOracle-Regular.otf') format('opentype'); font-weight:400; }
@font-face { font-family:'ABC Oracle Edu'; src:url('file:///Users/azizsunderji/Dropbox/Home%20Economics/Brand%20Assets/OracleFont/Oracle%20Aziz%20Sunderji/Desktop/ABCOracle-Medium.otf') format('opentype'); font-weight:500; }
body { margin:0; background:#fff; font-family:'ABC Oracle Edu',sans-serif; }
svg { display:block; margin:20px auto; }
</style></head><body>
<svg id="chart" viewBox="0 0 960 987" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const P = {"years": [1910, 1920, 1930, 1940, 1950, 1960, 1970, 1980, 1990, 2000, 2020], "is_estimate": [false, false, false, false, false, false, false, false, false, false, true], "series": [{"name": "Suburbs", "color": "#0BB4FF", "values": [6.5, 9.7, 16.9, 20.1, 35.1, 55.4, 76.4, 101.5, 114.9, 140.7, 179.0]}, {"name": "Central city", "color": "#F4743B", "values": [19.5, 26.2, 37.8, 42.8, 49.4, 57.9, 63.8, 68.0, 77.8, 85.3, 106.0]}, {"name": "Non-metropolitan", "color": "#67A275", "values": [66.0, 69.8, 68.0, 68.8, 66.2, 66.0, 63.0, 57.1, 56.0, 55.4, 46.4]}], "mode": "level", "title": "U.S. population by metropolitan ring, 1910\u20132020", "subtitle": "Suburbs absorbed virtually all the population growth of the 20th century. Central-city population has been roughly flat since 1950; non-metro America has shrunk in absolute terms since 1970."};
const BG='#F6F7F3', TEXT='#3D3733', SUBTEXT='#7F7570', GRID='#e1e2e3';
const W=960, H=987, PAD=40;
const svg = d3.select('#chart');
svg.append('rect').attr('width',W).attr('height',H).attr('fill',BG);

// Title
svg.append('text').attr('x',PAD).attr('y',PAD+32)
  .attr('font-family','ABC Oracle Edu').attr('font-size',28).attr('font-weight',500).attr('fill',TEXT)
  .text(P.title);

// Subtitle — wrap to multiple lines
const subLines = [];
{
  const words = P.subtitle.split(/\s+/);
  let line = '';
  const maxChars = 95;
  for (const w of words) {
    if ((line + ' ' + w).length > maxChars) { subLines.push(line.trim()); line = w; }
    else { line += ' ' + w; }
  }
  if (line.trim()) subLines.push(line.trim());
}
const subT = svg.append('text').attr('x',PAD).attr('y',PAD+32+34)
  .attr('font-family','ABC Oracle Edu').attr('font-size',19).attr('font-weight',400).attr('fill',SUBTEXT);
subLines.forEach((l,i) => subT.append('tspan').attr('x',PAD).attr('dy', i===0 ? 0 : 24).text(l));

const chartTop = PAD + 32 + 34 + 24*subLines.length + 60;
const chartBottom = H - PAD - 180;
const chartLeft = PAD + 70;
const chartRight = W - PAD - 165;

const xs = P.years;
const x = d3.scaleLinear().domain([1910, 2020]).range([chartLeft, chartRight]);
const flat = P.series.flatMap(s => s.values);
const ymax = d3.max(flat) * 1.08;
const y = d3.scaleLinear().domain([0, ymax]).range([chartBottom, chartTop]);

function fmtY(v) {
  if (P.mode === 'indexed') return Math.round(v);
  return Math.round(v);
}

const yTicks = (P.mode === 'indexed') ? [0, 100, 200, 300, 400, 500] : [0, 50, 100, 150, 200];
const gridG = svg.append('g').attr('id','grid');
yTicks.forEach(t => {
  if (t > ymax) return;
  gridG.append('line').attr('x1',chartLeft).attr('x2',chartRight)
    .attr('y1',y(t)).attr('y2',y(t)).attr('stroke',GRID).attr('stroke-width',0.5);
});
const yLabG = svg.append('g').attr('id','y-labels');
yTicks.forEach((t,i) => {
  if (t > ymax) return;
  const isTop = (i === yTicks.length - 1) || (yTicks[i+1] && yTicks[i+1] > ymax);
  let lbl = String(fmtY(t));
  if (isTop) lbl = P.mode === 'indexed' ? lbl : lbl + 'M';
  yLabG.append('text').attr('x',chartLeft-8).attr('y',y(t)).attr('text-anchor','end').attr('dy','0.32em')
    .attr('font-family','ABC Oracle Edu').attr('font-size',16).attr('font-weight',300).attr('fill','#333')
    .text(lbl);
});

// X-axis ticks every decade
const xTickG = svg.append('g').attr('id','x-ticks');
const xLabG = svg.append('g').attr('id','x-labels');
const decades = [1910, 1920, 1930, 1940, 1950, 1960, 1970, 1980, 1990, 2000, 2010, 2020];
decades.forEach(yr => {
  xTickG.append('line').attr('x1',x(yr)).attr('x2',x(yr))
    .attr('y1',chartBottom).attr('y2',chartBottom+10).attr('stroke',TEXT).attr('stroke-width',0.5);
  let lbl = String(yr);
  if (yr !== 1910 && yr !== 1950 && yr !== 2000 && yr !== 2020) lbl = String(yr).slice(2);
  xLabG.append('text').attr('x',x(yr)).attr('y',chartBottom+30).attr('text-anchor','middle')
    .attr('font-family','ABC Oracle Edu').attr('font-size',16).attr('font-weight',300).attr('fill','#333')
    .text(lbl);
});

// Lines — solid for canonical CENSR-4 years (through 2000), dashed for 2020 estimate
const lineFn = d3.line().x((_,i)=>x(xs[i])).y(v=>y(v));
const lineFnSolid = d3.line().x((_,i)=>x(xs[i])).y(v=>y(v)).defined((_,i)=> xs[i] <= 2000);
const lineFnEst   = d3.line().x((_,i)=>x(xs[i])).y(v=>y(v)).defined((_,i)=> xs[i] >= 2000);

const linesG = svg.append('g').attr('id','lines');
P.series.forEach(s => {
  // Solid through 2000
  linesG.append('path').attr('d',lineFnSolid(s.values))
    .attr('fill','none').attr('stroke',s.color).attr('stroke-width',2.5)
    .attr('style','mix-blend-mode: multiply');
  // Dashed from 2000 to 2020 (estimate)
  linesG.append('path').attr('d',lineFnEst(s.values))
    .attr('fill','none').attr('stroke',s.color).attr('stroke-width',2.5)
    .attr('stroke-dasharray','5,5')
    .attr('style','mix-blend-mode: multiply');
});

// Dots: solid for canonical years, open circle for 2020
const dotsG = svg.append('g').attr('id','dots');
P.series.forEach(s => {
  xs.forEach((yr, i) => {
    const isEst = P.is_estimate[i];
    dotsG.append('circle').attr('cx', x(yr)).attr('cy', y(s.values[i]))
      .attr('r', 3.5).attr('fill', isEst ? BG : s.color)
      .attr('stroke', s.color).attr('stroke-width', isEst ? 2 : 0);
  });
});

// Right-side labels with collision avoidance
const lastIdx = xs.length - 1;
const labels = P.series.map(s => ({
  name: s.name, color: s.color, y: y(s.values[lastIdx]), v: s.values[lastIdx]
}));
labels.sort((a,b) => a.y - b.y);
const minGap = 28;
for (let i = 1; i < labels.length; i++) {
  if (labels[i].y - labels[i-1].y < minGap) labels[i].y = labels[i-1].y + minGap;
}
const labG = svg.append('g').attr('id','labels');
labels.forEach(d => {
  labG.append('text').attr('x',chartRight+12).attr('y',d.y).attr('dy','0.32em')
    .attr('font-family','ABC Oracle Edu').attr('font-size',17).attr('font-weight',500).attr('fill',d.color)
    .text(d.name);
});

// Source note
const srcLines = [
  'Source: U.S. Census Bureau, CENSR-4 (Hobbs & Stoops, 2002), Figures 1-14 and 1-15: total U.S.',
  'population by metropolitan status, 1910-2000. 2020 data point (dashed, hollow markers) is an',
  'estimate from Brookings/Frey “America’s New Demographics” — no single Census Bureau publication',
  'gives the 3-way national split for 2020 directly. Metro definitions follow the OMB delineation in',
  'force at each census; methodology break in 2003 (“central city” → “principal city”).',
];
const srcG = svg.append('g').attr('id','source');
const srcStart = H - PAD - 15 - (srcLines.length - 1) * 16;
const srcT = srcG.append('text').attr('font-family','ABC Oracle Edu').attr('font-size',13)
  .attr('font-weight',200).attr('fill',TEXT);
srcLines.forEach((l,i) => srcT.append('tspan').attr('x',PAD).attr('y', srcStart + i*16).text(l));
</script>
</body></html>
