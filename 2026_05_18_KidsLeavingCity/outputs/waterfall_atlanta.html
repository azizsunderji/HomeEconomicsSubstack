<body>

<script>
const DATA = [{"name": "DeKalb", "full_name": "DeKalb County", "fips": "13089", "pop_2011": 165972, "pop_2024": 171001, "delta": 5029, "births": 135914, "aging": 114627, "net_mig": -16258, "has_decomp": true}, {"name": "Fulton", "full_name": "Fulton County", "fips": "13121", "pop_2011": 224080, "pop_2024": 222302, "delta": -1778, "births": 166848, "aging": 160305, "net_mig": -8321, "has_decomp": true}, {"name": "Bartow", "full_name": "Bartow County", "fips": "13015", "pop_2011": 26323, "pop_2024": 26491, "delta": 168, "births": 14586, "aging": 19500, "net_mig": 5082, "has_decomp": true}, {"name": "Cobb", "full_name": "Cobb County", "fips": "13067", "pop_2011": 176159, "pop_2024": 172421, "delta": -3738, "births": 119262, "aging": 128364, "net_mig": 5364, "has_decomp": true}, {"name": "Carroll", "full_name": "Carroll County", "fips": "13045", "pop_2011": 27843, "pop_2024": 30575, "delta": 2732, "births": 17438, "aging": 20201, "net_mig": 5495, "has_decomp": true}, {"name": "Clayton", "full_name": "Clayton County", "fips": "13063", "pop_2011": 75058, "pop_2024": 76197, "delta": 1139, "births": 46935, "aging": 53384, "net_mig": 7588, "has_decomp": true}, {"name": "Coweta", "full_name": "Coweta County", "fips": "13077", "pop_2011": 34787, "pop_2024": 35682, "delta": 895, "births": 18155, "aging": 25800, "net_mig": 8540, "has_decomp": true}, {"name": "Douglas", "full_name": "Douglas County", "fips": "13097", "pop_2011": 37022, "pop_2024": 37527, "delta": 505, "births": 18660, "aging": 27577, "net_mig": 9422, "has_decomp": true}, {"name": "Fayette", "full_name": "Fayette County", "fips": "13113", "pop_2011": 27279, "pop_2024": 27209, "delta": -70, "births": 9879, "aging": 22571, "net_mig": 12622, "has_decomp": true}, {"name": "Cherokee", "full_name": "Cherokee County", "fips": "13057", "pop_2011": 59184, "pop_2024": 63700, "delta": 4516, "births": 35615, "aging": 44039, "net_mig": 12940, "has_decomp": true}, {"name": "Henry", "full_name": "Henry County", "fips": "13151", "pop_2011": 58981, "pop_2024": 63828, "delta": 4847, "births": 34967, "aging": 45694, "net_mig": 15574, "has_decomp": true}, {"name": "Paulding", "full_name": "Paulding County", "fips": "13223", "pop_2011": 42447, "pop_2024": 46930, "delta": 4483, "births": 19203, "aging": 31770, "net_mig": 17050, "has_decomp": true}, {"name": "Forsyth", "full_name": "Forsyth County", "fips": "13117", "pop_2011": 54732, "pop_2024": 69171, "delta": 14439, "births": 24972, "aging": 41623, "net_mig": 31090, "has_decomp": true}, {"name": "Gwinnett", "full_name": "Gwinnett County", "fips": "13135", "pop_2011": 236567, "pop_2024": 252809, "delta": 16242, "births": 144391, "aging": 174827, "net_mig": 46678, "has_decomp": true}, {"name": "Barrow", "full_name": "Barrow County", "fips": "13013", "pop_2011": 19554, "pop_2024": 23700, "delta": 4146, "births": null, "aging": 13996, "net_mig": null, "has_decomp": false}, {"name": "Butts", "full_name": "Butts County", "fips": "13035", "pop_2011": 5218, "pop_2024": 5641, "delta": 423, "births": null, "aging": 3818, "net_mig": null, "has_decomp": false}, {"name": "Dawson", "full_name": "Dawson County", "fips": "13085", "pop_2011": 4968, "pop_2024": 6862, "delta": 1894, "births": null, "aging": 3767, "net_mig": null, "has_decomp": false}, {"name": "Heard", "full_name": "Heard County", "fips": "13149", "pop_2011": 2947, "pop_2024": 2725, "delta": -222, "births": null, "aging": 2214, "net_mig": null, "has_decomp": false}, {"name": "Jasper", "full_name": "Jasper County", "fips": "13159", "pop_2011": 3445, "pop_2024": 3979, "delta": 534, "births": null, "aging": 2535, "net_mig": null, "has_decomp": false}, {"name": "Lumpkin", "full_name": "Lumpkin County", "fips": "13187", "pop_2011": 6113, "pop_2024": 5957, "delta": -156, "births": null, "aging": 4461, "net_mig": null, "has_decomp": false}, {"name": "Meriwether", "full_name": "Meriwether County", "fips": "13199", "pop_2011": 4987, "pop_2024": 4393, "delta": -594, "births": null, "aging": 3666, "net_mig": null, "has_decomp": false}, {"name": "Morgan", "full_name": "Morgan County", "fips": "13211", "pop_2011": 4355, "pop_2024": 4812, "delta": 457, "births": null, "aging": 3322, "net_mig": null, "has_decomp": false}, {"name": "Newton", "full_name": "Newton County", "fips": "13217", "pop_2011": 28403, "pop_2024": 30587, "delta": 2184, "births": null, "aging": 21159, "net_mig": null, "has_decomp": false}, {"name": "Pickens", "full_name": "Pickens County", "fips": "13227", "pop_2011": 6443, "pop_2024": 6700, "delta": 257, "births": null, "aging": 4784, "net_mig": null, "has_decomp": false}, {"name": "Pike", "full_name": "Pike County", "fips": "13231", "pop_2011": 4688, "pop_2024": 4732, "delta": 44, "births": null, "aging": 3728, "net_mig": null, "has_decomp": false}, {"name": "Rockdale", "full_name": "Rockdale County", "fips": "13247", "pop_2011": 22463, "pop_2024": 22534, "delta": 71, "births": null, "aging": 16845, "net_mig": null, "has_decomp": false}, {"name": "Spalding", "full_name": "Spalding County", "fips": "13255", "pop_2011": 15991, "pop_2024": 16130, "delta": 139, "births": null, "aging": 11420, "net_mig": null, "has_decomp": false}, {"name": "Walton", "full_name": "Walton County", "fips": "13297", "pop_2011": 22494, "pop_2024": 25771, "delta": 3277, "births": null, "aging": 16820, "net_mig": null, "has_decomp": false}, {"name": "Haralson", "full_name": "Haralson County", "fips": "13143", "pop_2011": 7108, "pop_2024": 7776, "delta": 668, "births": null, "aging": 5295, "net_mig": null, "has_decomp": false}];
const C = {"births": "#67A275", "aging": "#DADFCE", "natural": "#3F6E4B", "mig": "#0BB4FF", "net": "#3D3733", "bg": "#F6F7F3", "text": "#3D3733", "subtext": "#7F7570", "grid": "#e1e2e3"};
const MSA = "Atlanta";
const MSA_FULL = "Atlanta-Sandy Springs-Roswell, GA";
const WIDTH = 960, HEIGHT = 987;
const PAD = 40;

function fmtCount(v) {
  const a = Math.abs(v);
  let s;
  if (a >= 1_000_000) s = (v / 1_000_000).toFixed(a >= 10_000_000 ? 0 : 1) + 'M';
  else if (a >= 1000) s = Math.round(v / 1000) + 'k';
  else s = Math.round(v).toString();
  return (v > 0 ? '+' : '') + s;
}

function renderChart(parentSvg, xOffset, title, subtitle, componentsFn, legendItems) {
  // parentSvg = a d3 selection of the shared SVG. xOffset = horizontal shift.
  const g = parentSvg.append('g').attr('transform', `translate(${xOffset}, 0)`);

  // Background panel
  g.append('rect').attr('width', WIDTH).attr('height', HEIGHT).attr('fill', C.bg);

  g.append('text')
     .attr('x', PAD).attr('y', PAD + 32)
     .attr('font-family', 'ABC Oracle Edu').attr('font-size', 30).attr('font-weight', 500)
     .attr('fill', C.text)
     .text(title);

  g.append('text')
     .attr('x', PAD).attr('y', PAD + 32 + 30)
     .attr('font-family', 'ABC Oracle Edu').attr('font-size', 20).attr('font-weight', 400)
     .attr('fill', C.subtext)
     .text(subtitle);

  const titleBlockBottom = PAD + 32 + 30 + 65;
  const sourceTop = HEIGHT - PAD - 60;
  const xLabelArea = 180;
  const chartTop = titleBlockBottom;
  const chartBottom = sourceTop - xLabelArea;
  const chartLeft = PAD + 90;
  const chartRight = WIDTH - PAD;

  // Build per-county component arrays via componentsFn
  const enriched = DATA.map(d => ({
    ...d,
    components: d.has_decomp ? componentsFn(d) : [],
    delta_val: d.delta || 0,
  }));

  // Y-axis domain — symmetric enough to show all components on both sides
  const allValues = enriched.flatMap(d => [...d.components.map(c => c.val), d.delta_val]);
  const dataMin = d3.min(allValues);
  const dataMax = d3.max(allValues);
  const yPad = Math.max(Math.abs(dataMin), Math.abs(dataMax)) * 0.05;
  const y = d3.scaleLinear()
    .domain([dataMin - yPad, dataMax + yPad])
    .range([chartBottom, chartTop]);

  const x = d3.scaleBand()
    .domain(enriched.map(d => d.name))
    .range([chartLeft, chartRight])
    .padding(0.25);

  // Gridlines & y-axis labels
  const yTicks = y.ticks(8);
  const gridG = g.append('g').attr('class', 'grid-lines');
  yTicks.forEach(t => {
    gridG.append('line')
      .attr('x1', chartLeft - 10).attr('x2', chartRight)
      .attr('y1', y(t)).attr('y2', y(t))
      .attr('stroke', t === 0 ? C.text : C.grid)
      .attr('stroke-width', t === 0 ? 1 : 0.5);
  });

  const yLabG = g.append('g').attr('class', 'y-axis-labels');
  yTicks.forEach((t) => {
    yLabG.append('text')
      .attr('x', chartLeft - 14).attr('y', y(t))
      .attr('font-family', 'ABC Oracle Edu').attr('font-size', 18).attr('font-weight', 300)
      .attr('fill', '#333').attr('text-anchor', 'end').attr('dy', '0.32em')
      .text(fmtCount(t));
  });

  g.append('text')
     .attr('x', chartLeft - 50).attr('y', chartTop - 15)
     .attr('font-family', 'ABC Oracle Edu').attr('font-size', 15).attr('font-weight', 400)
     .attr('fill', C.subtext)
     .text('Children (signed contributions to 2011→2024 Δ)');

  // Bars
  const seriesG = g.append('g').attr('class', 'data-series');
  enriched.forEach(d => {
    const bw = x.bandwidth();
    if (!d.has_decomp) {
      const y0 = y(0), yEnd = y(d.delta_val);
      seriesG.append('rect')
        .attr('x', x(d.name)).attr('width', bw)
        .attr('y', Math.min(y0, yEnd)).attr('height', Math.abs(y0 - yEnd))
        .attr('fill', '#bbb').attr('opacity', 0.5)
        .attr('data-tip', `${d.full_name} (no births data)\n2011 → 2024: ${d.delta?.toLocaleString()}`);
      return;
    }
    let pos = 0, neg = 0;
    d.components.forEach(c => {
      let yTop, yBot;
      if (c.val >= 0) {
        yBot = y(pos);
        pos += c.val;
        yTop = y(pos);
      } else {
        yTop = y(neg);
        neg += c.val;
        yBot = y(neg);
      }
      seriesG.append('rect')
        .attr('x', x(d.name)).attr('width', bw)
        .attr('y', yTop).attr('height', yBot - yTop)
        .attr('fill', c.color)
        .attr('data-tip', `${d.full_name}\n${c.label}: ${fmtCount(c.val)}`);
    });
    // Net delta marker
    seriesG.append('line')
      .attr('x1', x(d.name) - 2).attr('x2', x(d.name) + bw + 2)
      .attr('y1', y(d.delta_val)).attr('y2', y(d.delta_val))
      .attr('stroke', C.net).attr('stroke-width', 2);
  });

  // X-axis labels (rotated)
  const xLabG = g.append('g').attr('class', 'x-axis-labels');
  enriched.forEach(d => {
    xLabG.append('text')
      .attr('x', x(d.name) + x.bandwidth() / 2).attr('y', chartBottom + 12)
      .attr('font-family', 'ABC Oracle Edu').attr('font-size', 13).attr('font-weight', 300)
      .attr('fill', '#333').attr('text-anchor', 'end')
      .attr('transform', `rotate(-45, ${x(d.name) + x.bandwidth() / 2}, ${chartBottom + 12})`)
      .text(d.name);
  });

  // Legend
  const legend = g.append('g').attr('class', 'legend')
    .attr('transform', `translate(${chartLeft}, ${sourceTop - 35})`);
  let lx = 0;
  legendItems.forEach(it => {
    if (it.line) {
      legend.append('line').attr('x1', lx).attr('x2', lx + 16).attr('y1', 6).attr('y2', 6)
        .attr('stroke', it.color).attr('stroke-width', 2);
    } else {
      legend.append('rect').attr('x', lx).attr('y', 0).attr('width', 16).attr('height', 12).attr('fill', it.color);
    }
    legend.append('text').attr('x', lx + 22).attr('y', 9)
      .attr('font-family', 'ABC Oracle Edu').attr('font-size', 14).attr('font-weight', 400)
      .attr('fill', C.text).text(it.label);
    lx += 22 + (it.label.length * 8) + 24;
  });

  // Source
  g.append('text')
    .attr('x', PAD).attr('y', HEIGHT - PAD - 18)
    .attr('font-family', 'ABC Oracle Edu').attr('font-size', 13).attr('font-weight', 200)
    .attr('fill', C.text)
    .text('Source: Census PEP (V2019 & V2024); CDC WONDER NCHS Natality (D66, 2007-2024).');

  g.append('text')
    .attr('x', PAD).attr('y', HEIGHT - PAD - 2)
    .attr('font-family', 'ABC Oracle Edu').attr('font-size', 13).attr('font-weight', 200)
    .attr('fill', C.subtext)
    .text(MSA_FULL);
}

const parentSvg = d3.select('#chart_combined');

// Left panel: three-component
renderChart(
  parentSvg, 0,
  `Where ${MSA} families went, 2011 → 2024`,
  'Three components: births, aging-out, net migration',
  d => [
    { val:  d.births,   color: C.births, label: 'Births' },
    { val: -d.aging,    color: C.aging,  label: 'Aging-out' },
    { val:  d.net_mig,  color: C.mig,    label: 'Net migration' },
  ],
  [
    { label: 'Births to residents', color: C.births },
    { label: 'Aging out of <18', color: C.aging },
    { label: 'Net migration', color: C.mig },
    { label: 'Net Δ marker', color: C.net, line: true },
  ]
);

// Right panel: two-component (natural change vs migration)
renderChart(
  parentSvg, WIDTH,
  `${MSA}: natural change vs net migration`,
  'Births and aging-out merged into one bar',
  d => [
    { val: d.births - d.aging, color: C.natural, label: 'Births − aging-out' },
    { val: d.net_mig,          color: C.mig,     label: 'Net migration' },
  ],
  [
    { label: 'Births − aging-out', color: C.natural },
    { label: 'Net migration', color: C.mig },
    { label: 'Net Δ marker', color: C.net, line: true },
  ]
);

// Tooltips (delegated)
const tip = d3.select('.tooltip');
d3.selectAll('rect[data-tip]')
  .on('mousemove', function(e) {
    tip.style('left', (e.pageX + 12) + 'px').style('top', (e.pageY + 12) + 'px')
       .style('display', 'block')
       .html(d3.select(this).attr('data-tip').replace(/\n/g, '<br>'));
  })
  .on('mouseout', () => tip.style('display', 'none'));
</script>
